<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal AI Solver - फोटो खींचो, समाधान पाओ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #050b14; color: #f3f4f6; }
        .glass { background: rgba(17, 24, 39, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .glow:hover { box-shadow: 0 0 25px rgba(59, 130, 246, 0.4); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 md:p-8">

    <!-- Top Navigation Bar -->
    <header class="max-w-4xl mx-auto w-full flex justify-between items-center py-4 border-b border-gray-800">
        <div class="flex items-center space-x-3">
            <div class="bg-blue-600 text-white p-2.5 rounded-xl font-extrabold text-xl shadow-lg shadow-blue-500/30">
                <i class="fa-solid fa-brain"></i>
            </div>
            <div>
                <h1 class="text-2xl font-black tracking-tight text-white">UNIVERSAL AI</h1>
                <p class="text-xs text-blue-400 font-medium">पढ़ाई, बिजनेस, कोडिंग और हर समस्या का समाधान</p>
            </div>
        </div>
        <button onclick="openSettings()" class="glass p-3 rounded-xl text-gray-300 hover:text-white glow transition" title="API Settings">
            <i class="fa-solid fa-gear text-lg"></i>
        </button>
    </header>

    <!-- Main App Container -->
    <main class="max-w-4xl mx-auto w-full my-8 space-y-6">
        
        <!-- Input Section -->
        <div class="glass p-6 md:p-8 rounded-3xl shadow-2xl space-y-5">
            
            <div>
                <label class="block text-xs font-semibold text-gray-400 mb-1">
                    <i class="fa-solid fa-layer-group text-blue-400 mr-1"></i>समस्या का क्षेत्र चुनें (Category)
                </label>
                <select id="problemCategory" class="w-full bg-gray-900/90 border border-gray-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-blue-500">
                    <option value="Education & Study">📚 पढ़ाई / स्कूल / कॉलेज (Study & Doubts)</option>
                    <option value="Business & Documents">💼 बिजनेस / कागजात / हिसाब-किताब (Business & Docs)</option>
                    <option value="Coding & Software Error">💻 कोडिंग एरर / सॉफ्टवेयर बग (Code Bug / Error)</option>
                    <option value="General Problem Solving">⚙️ कोई भी अन्य सामान्य समस्या (General Problem)</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-200 mb-2">
                    <i class="fa-solid fa-circle-question text-blue-400 mr-2"></i>अपनी समस्या लिखकर बताएं या फोटो अपलोड करें
                </label>
                <textarea id="userPrompt" rows="3" class="w-full bg-gray-900/90 border border-gray-700 rounded-2xl p-4 text-white placeholder-gray-500 focus:outline-none focus:border-blue-500 transition mb-3" placeholder="यहाँ अपनी समस्या या सवाल विस्तार से लिखें..."></textarea>
                
                <!-- Image Upload Box -->
                <div class="flex items-center space-x-3 bg-gray-900/60 border border-dashed border-gray-700 rounded-2xl p-4">
                    <label class="cursor-pointer bg-blue-600/20 hover:bg-blue-600/30 text-blue-400 px-4 py-2 rounded-xl text-xs font-bold transition flex items-center space-x-2">
                        <i class="fa-solid fa-camera"></i>
                        <span>फोटो या स्क्रीनशॉट चुनें</span>
                        <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="previewImage(event)">
                    </label>
                    <span id="fileName" class="text-xs text-gray-400 truncate">कोई फोटो नहीं चुनी गई</span>
                </div>
            </div>

            <button onclick="solveUniversalProblem()" id="solveBtn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-2xl shadow-lg shadow-blue-600/30 transition flex items-center justify-center space-x-2">
                <i class="fa-solid fa-wand-magic-sparkles"></i>
                <span>एआई से तुरंत समाधान निकालें (Instant Solution)</span>
            </button>
        </div>

        <!-- Loading Indicator -->
        <div id="loadingBox" class="hidden text-center py-12 space-y-3">
            <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-blue-500 border-t-transparent"></div>
            <p class="text-gray-400 text-sm font-medium">एआई आपकी फोटो और समस्या को गहराई से समझ रहा है...</p>
        </div>

        <!-- Output Result Section -->
        <div id="resultBox" class="hidden space-y-6">
            
            <div class="glass p-6 md:p-8 rounded-3xl space-y-4 border-l-4 border-blue-500">
                <div class="flex justify-between items-center">
                    <h3 class="text-lg font-bold text-blue-400 flex items-center space-x-2">
                        <i class="fa-solid fa-lightbulb"></i>
                        <span>सटीक समाधान और उपाय (Expert Solution)</span>
                    </h3>
                    <button onclick="speakAnswer()" class="bg-gray-800 hover:bg-gray-700 text-blue-400 px-4 py-2 rounded-xl text-xs font-bold transition flex items-center space-x-2">
                        <i class="fa-solid fa-volume-high"></i>
                        <span>बोलकर सुनें</span>
                    </button>
                </div>
                <div id="resExplanation" class="text-sm text-gray-200 leading-relaxed space-y-3">
                    <!-- Filled by JS -->
                </div>
                <div id="extraLinkBox" class="pt-2">
                    <!-- Dynamic Link (YouTube or Help) will appear here -->
                </div>
            </div>

        </div>

    </main>

    <!-- Settings Modal for Gemini API Key -->
    <div id="settingsModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="glass max-w-md w-full p-6 rounded-3xl space-y-4 border border-gray-700">
            <div class="flex justify-between items-center">
                <h3 class="text-lg font-bold text-white">Gemini API Settings</h3>
                <button onclick="closeSettings()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <p class="text-xs text-gray-400">अपनी Google AI Studio API Key (AIza...) यहाँ डालें।</p>
            <input type="password" id="apiKeyInput" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-blue-500" placeholder="AIza...">
            <button onclick="saveApiKey()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl transition">Save Key</button>
        </div>
    </div>

    <!-- Footer -->
    <footer class="max-w-4xl mx-auto w-full text-center py-4 text-xs text-gray-500 border-t border-gray-800">
        Universal AI Solver &bull; Powered by Google Gemini API
    </footer>

    <!-- JavaScript Logic -->
    <script>
        let selectedFileBase64 = null;
        let fileMimeType = null;

        function openSettings() {
            document.getElementById('apiKeyInput').value = localStorage.getItem('universal_gemini_key') || '';
            document.getElementById('settingsModal').classList.remove('hidden');
        }

        function closeSettings() {
            document.getElementById('settingsModal').classList.add('hidden');
        }

        function saveApiKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if (key) {
                localStorage.setItem('universal_gemini_key', key);
                alert('API Key सफलतापूर्वक सेव हो गई!');
                closeSettings();
            } else {
                alert('कृपया सही Key डालें।');
            }
        }

        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                document.getElementById('fileName').innerText = file.name;
                fileMimeType = file.type;
                const reader = new FileReader();
                reader.onloadend = function() {
                    selectedFileBase64 = reader.result.split(',')[1];
                }
                reader.readAsDataURL(file);
            }
        }

        async function solveUniversalProblem() {
            const category = document.getElementById('problemCategory').value;
            const userText = document.getElementById('userPrompt').value.trim();
            const apiKey = localStorage.getItem('universal_gemini_key');

            if (!userText && !selectedFileBase64) {
                alert('भाई, या तो समस्या लिखो या फोटो अपलोड करो!');
                return;
            }

            if (!apiKey) {
                alert('कृपया पहले कोने में सेटिंग पर क्लिक करके अपनी Gemini API Key सेट करें!');
                openSettings();
                return;
            }

            document.getElementById('loadingBox').classList.remove('hidden');
            document.getElementById('resultBox').classList.add('hidden');

            const systemInstruction = `You are an elite, multi-talented Universal Expert Assistant. 
            The user category is: ${category}.
            Analyze the user's input text and/or attached image thoroughly. 
            - If it's Education/Study: Provide a clear, step-by-step breakdown and tutorial style explanation in simple Hindi.
            - If it's Business/Documents: Spot errors, calculate figures if needed, and give professional business advice or document corrections in Hindi.
            - If it's Coding/Error: Find the bug, explain why it occurred, and provide the corrected code snippet clearly.
            - If it's General: Give a practical, direct, and effective solution.
            Format your response nicely using HTML tags like <p>, <strong>, <ul>, <li>, and <code> where necessary.`;

            let contentsArray = [{ text: userText || "Analyze this image and provide a complete solution." }];

            if (selectedFileBase64 && fileMimeType) {
                contentsArray.push({
                    inline_data: {
                        mime_type: fileMimeType,
                        data: selectedFileBase64
                    }
                });
            }

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ role: 'user', parts: contentsArray }],
                        system_instruction: { parts: [{ text: systemInstruction }] }
                    })
                });

                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error.message || 'Gemini API Error');
                }

                const rawText = data.candidates[0].content.parts[0].text;
                document.getElementById('resExplanation').innerHTML = rawText;

                // Add helpful YouTube/Web search fallback link if it's educational or complex
                const queryText = encodeURIComponent(userText || category);
                document.getElementById('extraLinkBox').innerHTML = `
                    <a href="https://www.youtube.com/results?search_query=${queryText}" target="_blank" class="inline-flex items-center space-x-2 bg-red-600 hover:bg-red-500 text-white px-4 py-2.5 rounded-xl text-xs font-bold transition shadow-lg shadow-red-600/30 mt-3">
                        <i class="fa-brands fa-youtube text-sm"></i>
                        <span>इस विषय से संबंधित वीडियो देखें</span>
                    </a>
                `;

                document.getElementById('loadingBox').classList.add('hidden');
                document.getElementById('resultBox').classList.remove('hidden');

            } catch (error) {
                console.error(error);
                document.getElementById('loadingBox').classList.add('hidden');
                alert('त्रुटि: ' + error.message + '\nकृपया अपनी API Key जांच लें।');
            }
        }

        function speakAnswer() {
            const text = document.getElementById('resExplanation').innerText;
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'hi-IN';
                window.speechSynthesis.speak(utterance);
            } else {
                alert('आपका ब्राउज़र वॉयस स्पीच सपोर्ट नहीं करता है।');
            }
        }
    </script>
</body>
</html>
