<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GuruAI - School Edition (UKG to 12th)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #050b14; color: #f3f4f6; }
        .glass { background: rgba(17, 24, 39, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .glow:hover { box-shadow: 0 0 25px rgba(59, 130, 246, 0.4); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 md:p-8">

    <!-- Top Navigation Bar -->
    <header class="max-w-4xl mx-auto w-full flex justify-between items-center py-4 border-b border-gray-800">
        <div class="flex items-center space-x-3">
            <div class="bg-blue-600 text-white p-2.5 rounded-xl font-extrabold text-xl shadow-lg shadow-blue-500/30">
                <i class="fa-solid fa-school"></i>
            </div>
            <div>
                <h1 class="text-2xl font-black tracking-tight text-white">GURU.AI</h1>
                <p class="text-xs text-blue-400 font-medium">School Edition (UKG to 12th - All Boards)</p>
            </div>
        </div>
        <button onclick="openSettings()" class="glass p-3 rounded-xl text-gray-300 hover:text-white glow transition" title="API Settings">
            <i class="fa-solid fa-gear text-lg"></i>
        </button>
    </header>

    <!-- Main App Container -->
    <main class="max-w-4xl mx-auto w-full my-8 space-y-6">
        
        <!-- Input Section -->
        <div class="glass p-6 md:p-8 rounded-3xl shadow-2xl space-y-5">
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-400 mb-1">
                        <i class="fa-solid fa-layer-group text-blue-400 mr-1"></i>क्लास चुनें
                    </label>
                    <select id="studentClass" class="w-full bg-gray-900/90 border border-gray-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-blue-500">
                        <option value="UKG / LKG">UKG / LKG (किंडरगार्टन)</option>
                        <option value="Class 1 to 5">कक्षा 1 से 5 (Primary)</option>
                        <option value="Class 6 to 8">कक्षा 6 से 8 (Middle School)</option>
                        <option value="Class 9 & 10">कक्षा 9 और 10 (High School)</option>
                        <option value="Class 11 & 12">कक्षा 11 और 12 (Senior Secondary)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-400 mb-1">
                        <i class="fa-solid fa-book-open text-blue-400 mr-1"></i>बोर्ड और विषय (Board & Subject)
                    </label>
                    <input type="text" id="boardAndSubject" class="w-full bg-gray-900/90 border border-gray-700 rounded-xl p-3 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-blue-500" placeholder="जैसे: CBSE / State Board - Math / Science">
                </div>
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-200 mb-2">
                    <i class="fa-solid fa-circle-question text-blue-400 mr-2"></i>सवाल लिखें या किताब के पन्ने की फोटो अपलोड करें
                </label>
                <textarea id="studentDoubt" rows="3" class="w-full bg-gray-900/90 border border-gray-700 rounded-2xl p-4 text-white placeholder-gray-500 focus:outline-none focus:border-blue-500 transition mb-3" placeholder="यहाँ अपना सवाल टाइप करें या नीचे फोटो अपलोड करें..."></textarea>
                
                <!-- Image Upload Box -->
                <div class="flex items-center space-x-3 bg-gray-900/60 border border-dashed border-gray-700 rounded-2xl p-4">
                    <label class="cursor-pointer bg-blue-600/20 hover:bg-blue-600/30 text-blue-400 px-4 py-2 rounded-xl text-xs font-bold transition flex items-center space-x-2">
                        <i class="fa-solid fa-camera"></i>
                        <span>किताब का फोटो चुनें</span>
                        <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="previewImage(event)">
                    </label>
                    <span id="fileName" class="text-xs text-gray-400 truncate">कोई फोटो नहीं चुनी गई</span>
                </div>
            </div>

            <button onclick="solveSchoolDoubt()" id="solveBtn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-2xl shadow-lg shadow-blue-600/30 transition flex items-center justify-center space-x-2">
                <i class="fa-solid fa-wand-magic-sparkles"></i>
                <span>एआई गुरु से समझें (Instant Solution)</span>
            </button>
        </div>

        <!-- Loading Indicator -->
        <div id="loadingBox" class="hidden text-center py-12 space-y-3">
            <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-blue-500 border-t-transparent"></div>
            <p class="text-gray-400 text-sm font-medium">एआई गुरु किताब और सवाल को पढ़कर सरल उत्तर तैयार कर रहे हैं...</p>
        </div>

        <!-- Output Result Section -->
        <div id="resultBox" class="hidden space-y-6">
            
            <div class="glass p-6 md:p-8 rounded-3xl space-y-4 border-l-4 border-blue-500">
                <div class="flex justify-between items-center">
                    <h3 class="text-lg font-bold text-blue-400 flex items-center space-x-2">
                        <i class="fa-solid fa-chalkboard-user"></i>
                        <span>सरल स्पष्टीकरण (Easy Explanation)</span>
                    </h3>
                    <button onclick="speakAnswer()" class="bg-gray-800 hover:bg-gray-700 text-blue-400 px-4 py-2 rounded-xl text-xs font-bold transition flex items-center space-x-2">
                        <i class="fa-solid fa-volume-high"></i>
                        <span>बोलकर सुनें</span>
                    </button>
                </div>
                <div id="resExplanation" class="text-sm text-gray-200 leading-relaxed space-y-3">
                    <!-- Filled by JS -->
                </div>
            </div>

        </div>

    </main>

    <!-- Settings Modal for Groq API Key -->
    <div id="settingsModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="glass max-w-md w-full p-6 rounded-3xl space-y-4 border border-gray-700">
            <div class="flex justify-between items-center">
                <h3 class="text-lg font-bold text-white">Groq API Settings</h3>
                <button onclick="closeSettings()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <p class="text-xs text-gray-400">अपनी Groq API Key (gsk_...) यहाँ डालें।</p>
            <input type="password" id="apiKeyInput" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-blue-500" placeholder="gsk_...">
            <button onclick="saveApiKey()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl transition">Save Key</button>
        </div>
    </div>

    <!-- Footer -->
    <footer class="max-w-4xl mx-auto w-full text-center py-4 text-xs text-gray-500 border-t border-gray-800">
        GuruAI School Edition &bull; Powered by Groq LLaMA Engine
    </footer>

    <!-- JavaScript Logic -->
    <script>
        let base64Image = null;

        function openSettings() {
            document.getElementById('apiKeyInput').value = localStorage.getItem('guru_school_key') || '';
            document.getElementById('settingsModal').classList.remove('hidden');
        }

        function closeSettings() {
            document.getElementById('settingsModal').classList.add('hidden');
        }

        function saveApiKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if (key) {
                localStorage.setItem('guru_school_key', key);
                alert('API Key सुरक्षित रूप से सेव हो गई!');
                closeSettings();
            } else {
                alert('कृपया सही Key डालें।');
            }
        }

        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                document.getElementById('fileName').innerText = file.name;
                const reader = new FileReader();
                reader.onloadend = function() {
                    base64Image = reader.result;
                }
                reader.readAsDataURL(file);
            }
        }

        async function solveSchoolDoubt() {
            const grade = document.getElementById('studentClass').value;
            const boardSub = document.getElementById('boardAndSubject').value.trim();
            const doubt = document.getElementById('studentDoubt').value.trim();
            const apiKey = localStorage.getItem('guru_school_key');

            if (!doubt && !base64Image) {
                alert('भाई, या तो सवाल लिखो या किताब की फोटो अपलोड करो!');
                return;
            }

            if (!apiKey) {
                alert('कृपया पहले कोने में सेटिंग पर क्लिक करके अपनी Groq API Key सेट करें!');
                openSettings();
                return;
            }

            document.getElementById('loadingBox').classList.remove('hidden');
            document.getElementById('resultBox').classList.add('hidden');

            const textPrompt = `Act as a friendly, expert school teacher for students in ${grade} (${boardSub || 'School Board'}). 
            Student's Question/Doubt: ${doubt || 'Explain the attached textbook page/question.'}
            
            Provide a very clear, step-by-step, and encouraging explanation in simple Hindi text. Use real-life examples so a school student can understand easily. Format using HTML tags like <p>, <strong>, <ul>, <li> where necessary.`;

            let messagesContent = [{ type: "text", text: textPrompt }];
            
            if (base64Image) {
                messagesContent.push({
                    type: "image_url",
                    image_url: { url: base64Image }
                });
            }

            try {
                // Using a vision-capable or high performance Groq endpoint setup
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: 'llama-3.3-70b-versatile',
                        messages: [
                            { role: 'system', content: 'You are an expert school mentor. Respond clearly in Hindi text.' },
                            { role: 'user', content: messagesContent }
                        ],
                        temperature: 0.7
                    })
                });

                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error.message || 'Groq API Error');
                }

                const rawText = data.choices[0].message.content;
                document.getElementById('resExplanation').innerHTML = rawText;

                document.getElementById('loadingBox').classList.add('hidden');
                document.getElementById('resultBox').classList.remove('hidden');

            } catch (error) {
                console.error(error);
                document.getElementById('loadingBox').classList.add('hidden');
                alert('त्रुटि: ' + error.message + '\nकृपया अपनी Groq API Key जांच लें।');
            }
        }

        function speakAnswer() {
            const text = document.getElementById('resExplanation').innerText;
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'hi-IN';
                window.speechSynthesis.speak(utterance);
            } else {
                alert('आपका ब्राउज़र वॉयस स्पीच सपोर्ट नहीं करता है।');
            }
        }
    </script>
</body>
</html>
